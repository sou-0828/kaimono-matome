<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学生の買ってよかったもの｜まとめ</title>
<meta name="description" content="Xアカウント「そう｜大学生の買ってよかったもの」(@monstsstk)で紹介した商品のまとめページです。">
<meta property="og:title" content="大学生の買ってよかったもの｜まとめ">
<meta property="og:description" content="Xで紹介した「買ってよかったもの」をまとめています。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sou-0828.github.io/kaimono-matome/">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --navy: #1f3a5f;
    --navy-dark: #162a45;
    --navy-light: #eef2f7;
    --text: #222;
    --sub: #666;
    --border: #e3e7ec;
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg-soft);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
  }
  a { color: var(--navy); }

  /* ヘッダー */
  .site-header {
    background: var(--bg);
    border-bottom: 3px solid var(--navy);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .site-title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .x-link {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--navy);
    border-radius: 999px;
    color: var(--navy);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
  }
  .x-link:hover { background: var(--navy); color: #fff; }
  .x-link svg { width: 14px; height: 14px; fill: currentColor; }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }
  .intro {
    margin: 0 0 8px;
    font-size: 0.9rem;
    color: var(--sub);
  }

  /* カテゴリ */
  .category { margin-top: 28px; }
  .category-title {
    margin: 0 0 14px;
    padding: 4px 0 4px 12px;
    border-left: 5px solid var(--navy);
    font-size: 1.15rem;
    color: var(--navy);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* 商品カード */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-img {
    background: #fff;
    aspect-ratio: 4 / 3;
    max-height: 240px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .card-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .card-img.no-image img { display: none; }
  .card-img.no-image::after {
    content: "画像準備中";
    color: #aab3bf;
    font-size: 0.85rem;
  }
  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-name {
    margin: 0 0 4px;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.5;
  }
  .card-price {
    margin: 0 0 10px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
  }
  .card-price.check {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--sub);
  }
  .card-comment {
    margin: 0 0 8px;
    font-size: 0.9rem;
  }
  .card-note {
    margin: 0 0 12px;
    padding: 8px 10px;
    background: var(--navy-light);
    border-radius: 8px;
    font-size: 0.82rem;
    color: #444;
  }
  .card-note b { color: var(--navy); }
  .btn {
    margin-top: auto;
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
  }
  .btn:hover { background: var(--navy-dark); }

  /* フッター */
  .site-footer {
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 20px 16px 28px;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .footer-inner { max-width: 960px; margin: 0 auto; }
  .site-footer p { margin: 0 0 6px; }
  .copyright { margin-top: 12px !important; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title">大学生の買ってよかったもの｜まとめ</h1>
    <a class="x-link" href="https://x.com/monstsstk" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      @monstsstk
    </a>
  </div>
</header>

<main>
  <p class="intro">Xで紹介した「買ってよかったもの」をまとめています。</p>
  <div id="list"></div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p>当サイトは楽天アフィリエイトプログラムに参加しています。リンク経由で購入されると、運営者に報酬が入る場合があります（PR）</p>
    <p>価格は変動します。購入前にリンク先でご確認ください</p>
    <p class="copyright">&copy; そう｜大学生の買ってよかったもの</p>
  </div>
</footer>

<script>
/* =========================================================
   カテゴリ（ここに並んだ順で表示されます）
   ========================================================= */
const CATEGORIES = [
  "PC周辺・ガジェット",
  "日用品",
];

/* =========================================================
   商品データ
   新しい商品を追加するときは、下の配列に { ... } を1つ足すだけ。
   - category : 上の CATEGORIES のどれか（新カテゴリなら CATEGORIES にも追加）
   - name     : 商品名
   - price    : 価格（例 "3,490円〜"）。空 "" ならリンク先で確認する表示になります
   - image    : 楽天の商品画像URL（空 "" なら「画像準備中」表示）
   - comment  : 良い点
   - note     : 注意点（空 "" なら非表示）
   - url      : 楽天アフィリエイトリンク
   ========================================================= */
const PRODUCTS = [
  {
    category: "PC周辺・ガジェット",
    name: "Anker Power Bank (10000mAh, 22.5W)",
    price: "3,490円〜",
    image: "https://hbb.afl.rakuten.co.jp/hgb/59d5b3b7.8e6a4930.59d5b3b8.1b769217/?me_id=1294713&item_id=10001908&pc=https%3A%2F%2Fthumbnail.image.rakuten.co.jp%2F%400_mall%2Fanker%2Fcabinet%2Ftmb%2Fa1%2Fa1257_normal.jpg%3F_ex%3D400x400&s=400x400&t=pict",
    comment: "レビュー2,330件。授業の合間の充電切れ対策に。大学のコンセント争奪戦から解放されるやつ",
    note: "",
    url: "https://a.r10.to/hgbdGR",
  },
  {
    category: "PC周辺・ガジェット",
    name: "Anker Nano Power Bank (5000mAh)",
    price: "",
    image: "https://hbb.afl.rakuten.co.jp/hgb/59d5b3b7.8e6a4930.59d5b3b8.1b769217/?me_id=1294713&item_id=10001561&pc=https%3A%2F%2Fthumbnail.image.rakuten.co.jp%2F%400_mall%2Fanker%2Fcabinet%2Fdeal%2F2611m2%2Fa1645_11m2.jpg%3F_ex%3D400x400&s=400x400&t=pict",
    comment: "レビュー4,154件。5000mAhの小型タイプ。「今日は荷物を軽くしたい日」用",
    note: "",
    url: "https://a.r10.to/hP0EIw",
  },
  {
    category: "日用品",
    name: "ヒオリエ ビッグフェイスタオル",
    price: "890円〜",
    image: "https://hbb.afl.rakuten.co.jp/hgb/59d5b487.0142bd79.59d5b488.4731be3c/?me_id=1229420&item_id=10000264&pc=https%3A%2F%2Fthumbnail.image.rakuten.co.jp%2F%400_mall%2Ftoucher-home%2Fcabinet%2Fimage02%2Fhslft_01scx.jpg%3F_ex%3D400x400&s=400x400&t=pict",
    comment: "レビュー118,283件。一人暮らしの洗濯回数を減らす、バスタオル代わりの定番",
    note: "",
    url: "https://a.r10.to/hYhGtB",
  },
];

/* ===== 以下は表示処理（通常は触らなくてOK） ===== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function cardHTML(p) {
  const priceHTML = p.price
    ? `<p class="card-price">${esc(p.price)}</p>`
    : `<p class="card-price check">価格はリンク先でご確認ください</p>`;
  const noteHTML = p.note
    ? `<p class="card-note"><b>注意点：</b>${esc(p.note)}</p>`
    : "";
  return `
    <article class="card">
      <div class="card-img${p.image ? "" : " no-image"}">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"
             onerror="this.parentNode.classList.add('no-image')">
      </div>
      <div class="card-body">
        <h3 class="card-name">${esc(p.name)}</h3>
        ${priceHTML}
        <p class="card-comment">${esc(p.comment)}</p>
        ${noteHTML}
        <a class="btn" href="${esc(p.url)}" target="_blank" rel="nofollow sponsored noopener">楽天市場で見る</a>
      </div>
    </article>`;
}

function render() {
  const cats = [...CATEGORIES];
  PRODUCTS.forEach(p => { if (!cats.includes(p.category)) cats.push(p.category); });
  document.getElementById("list").innerHTML = cats.map(cat => {
    const items = PRODUCTS.filter(p => p.category === cat);
    if (!items.length) return "";
    return `
      <section class="category">
        <h2 class="category-title">${esc(cat)}</h2>
        <div class="grid">${items.map(cardHTML).join("")}</div>
      </section>`;
  }).join("");
}

render();
</script>
</body>
</html>
